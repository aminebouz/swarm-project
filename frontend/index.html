<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swarm Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
header { background: #1a1d2e; border-bottom: 1px solid #2d3148; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.2rem; font-weight: 600; color: #a78bfa; }
header span { font-size: 0.8rem; color: #64748b; }
.layout { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 57px); gap: 1px; background: #2d3148; }
.left-panel { background: #0f1117; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
.right-panel { background: #0f1117; display: grid; grid-template-rows: 1fr 1fr; gap: 1px; }
.panel { background: #0f1117; padding: 1.25rem; overflow: hidden; display: flex; flex-direction: column; }
.section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; margin-bottom: 0.75rem; }
label { display: block; font-size: 0.78rem; color: #94a3b8; margin-bottom: 0.3rem; }
textarea, input[type=text] { width: 100%; background: #1a1d2e; border: 1px solid #2d3148; border-radius: 6px; color: #e2e8f0; padding: 0.6rem 0.75rem; font-size: 0.8rem; font-family: inherit; }
textarea { resize: vertical; min-height: 70px; }
input[type=text]:focus, textarea:focus { outline: none; border-color: #a78bfa; }
input[type=range] { width: 100%; accent-color: #a78bfa; margin: 0.25rem 0; }
.rounds-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #94a3b8; }
.rounds-val { color: #a78bfa; font-weight: 700; font-size: 1rem; }
.agents-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
.btn-add { background: #1e2a3a; border: 1px solid #3b82f6; color: #60a5fa; border-radius: 6px; padding: 0.3rem 0.75rem; font-size: 0.75rem; cursor: pointer; }
.btn-add:hover { background: #1e3a5f; }
.agent-card { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.6rem; position: relative; }
.agent-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
.agent-index { font-size: 0.7rem; font-weight: 700; color: #a78bfa; background: #2d2060; padding: 0.15rem 0.5rem; border-radius: 999px; }
.btn-remove { background: none; border: none; color: #64748b; cursor: pointer; font-size: 1rem; padding: 0; line-height: 1; }
.btn-remove:hover { color: #fb7185; }
.agent-card label { margin-top: 0.4rem; }
.btn-start { width: 100%; padding: 0.8rem; background: #a78bfa; color: #0f1117; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 0.5rem; }
.btn-start:hover { background: #c4b5fd; }
.btn-start:disabled { background: #2d3148; color: #64748b; cursor: not-allowed; }
.status { padding: 0.5rem; border-radius: 6px; font-size: 0.75rem; text-align: center; background: #1a1d2e; color: #64748b; }
.status.running { background: #1e3a2f; color: #4ade80; }
.status.done { background: #1e2a3a; color: #60a5fa; }
.status.error { background: #3a1e1e; color: #fb7185; }
.logs-container { overflow-y: auto; flex: 1; margin-top: 0.5rem; }
.log-entry { font-size: 0.78rem; padding: 0.4rem 0.5rem; border-bottom: 1px solid #1a1d2e; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.log-entry.system { color: #a78bfa; font-weight: 600; }
.log-entry.consensus { color: #fb7185; font-weight: 600; background: #1a1220; border-radius: 4px; }
.log-entry.thinking { color: #94a3b8; font-style: italic; }
.log-entry.result { color: #e2e8f0; padding-left: 1rem; border-left: 2px solid #2d3148; margin: 0.2rem 0.5rem; }
.graph-wrap { flex: 1; overflow: hidden; }
svg { width: 100%; height: 100%; }
.node circle { stroke-width: 2; cursor: pointer; }
.node text { font-size: 11px; fill: #e2e8f0; pointer-events: none; }
.link { stroke: #2d3148; stroke-opacity: 0.5; }
.final-report { background: #1a1d2e; border-radius: 8px; padding: 1rem; font-size: 0.78rem; line-height: 1.8; color: #cbd5e1; white-space: pre-wrap; overflow-y: auto; flex: 1; display: none; margin-top: 0.5rem; }
.badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; background: #1e3a2f; color: #4ade80; margin-bottom: 0.5rem; }
.color-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
</style>
</head>
<body>

<header>
  <h1>🤖 Swarm Intelligence Engine</h1>
  <span id="conn-status">⚪ Connecting...</span>
</header>

<div class="layout">

  <div class="left-panel">

    <div>
      <div class="section-title">Topic / Scenario</div>
      <textarea id="topic" rows="3" placeholder="Ex: Should we migrate our Python apps from OpenShift to AWS, Azure or GCP?">Should we migrate our Python applications from OpenShift to a private cloud (AWS, Azure, or GCP)?</textarea>
    </div>

    <div>
      <div class="rounds-row">
        <div class="section-title" style="margin:0">Max rounds</div>
        <span class="rounds-val" id="rounds-val">3</span>
      </div>
      <input type="range" id="rounds" min="2" max="10" value="3"
        oninput="document.getElementById('rounds-val').textContent=this.value">
    </div>

    <div>
      <div class="agents-header">
        <div class="section-title" style="margin:0">Agents</div>
        <button class="btn-add" onclick="addAgent()">+ Add agent</button>
      </div>
      <div id="agents-list"></div>
    </div>

    <button class="btn-start" id="startBtn" onclick="startSimulation()">▶ Start Simulation</button>
    <div class="status" id="status">Ready</div>

  </div>

  <div class="right-panel">

    <div class="panel">
      <div class="section-title">Live Logs</div>
      <div class="logs-container" id="logs"></div>
    </div>

    <div class="panel">
      <div class="section-title">Knowledge Graph</div>
      <div id="final-badge"></div>
      <div class="graph-wrap" id="graph-wrap">
        <svg id="graph-svg"></svg>
      </div>
      <div class="final-report" id="final-report"></div>
    </div>

  </div>
</div>

<script>
let ws = null;
let agentCount = 0;
const agentColors = {};
const palette = [
  "#a78bfa","#34d399","#60a5fa","#f59e0b",
  "#fb7185","#38bdf8","#facc15","#4ade80"
];

// ── Default agents ───────────────────────────────────────
const defaultAgents = [
  {
    name: "Senior Python Developer",
    profile: "You are a Senior Python Developer with 10 years of experience maintaining Django, FastAPI, and Celery applications on OpenShift. You care about code quality, performance, and avoiding vendor lock-in.",
    description: "Evaluate technical feasibility of migration from a developer perspective. Focus on code changes, framework compatibility, and developer experience."
  },
  {
    name: "DevOps Engineer",
    profile: "You are a DevOps Engineer managing an OpenShift cluster with ArgoCD, Helm, Prometheus and Grafana. You have hands-on experience with EKS, AKS, and GKE.",
    description: "Assess infrastructure and operational implications. Focus on migration effort, CI/CD impact, monitoring, and hidden costs."
  },
  {
    name: "Project Manager",
    profile: "You are a Project Manager with a 500,000 euros annual budget. The current OpenShift cluster costs 120,000 euros/year. Your goal is to reduce costs by 30% and improve scalability within 18 months.",
    description: "Make the final strategic recommendation for the board. Balance cost, risk, timeline, and business value."
  }
];

function addAgent(data = null) {
  const idx = agentCount++;
  const color = palette[idx % palette.length];
  const id = `agent-form-${idx}`;
  agentColors[id] = color;

  const d = data || { name: "", profile: "", description: "" };

  const card = document.createElement("div");
  card.className = "agent-card";
  card.id = id;
  card.innerHTML = `
    <div class="agent-card-header">
      <span class="agent-index">
        <span class="color-dot" style="background:${color}"></span>
        Agent ${idx + 1}
      </span>
      <button class="btn-remove" onclick="removeAgent('${id}')" title="Remove">✕</button>
    </div>
    <label>Name</label>
    <input type="text" class="agent-name" placeholder="Ex: Senior Python Developer" value="${d.name}">
    <label>Profile (System prompt)</label>
    <textarea class="agent-profile" rows="3" placeholder="Ex: You are a senior developer with 10 years of experience...">${d.profile}</textarea>
    <label>Description / Goal</label>
    <textarea class="agent-desc" rows="2" placeholder="Ex: Evaluate technical feasibility of the migration...">${d.description}</textarea>
  `;
  document.getElementById("agents-list").appendChild(card);
}

function removeAgent(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function getAgents() {
  const cards = document.querySelectorAll(".agent-card");
  const agents = [];
  cards.forEach((card, i) => {
    const name = card.querySelector(".agent-name").value.trim();
    const profile = card.querySelector(".agent-profile").value.trim();
    const description = card.querySelector(".agent-desc").value.trim();
    if (name && profile) {
      agents.push({ name, profile, description, color: palette[i % palette.length] });
    }
  });
  return agents;
}

function addLog(text, type) {
  const div = document.createElement("div");
  div.className = `log-entry ${type}`;
  div.textContent = text;
  const logs = document.getElementById("logs");
  logs.appendChild(div);
  logs.scrollTop = logs.scrollHeight;
}

function connectWS() {
  ws = new WebSocket("ws://localhost:8000/ws");
  ws.onopen = () => {
    document.getElementById("conn-status").textContent = "🟢 Connected";
  };
  ws.onclose = () => {
    document.getElementById("conn-status").textContent = "🔴 Disconnected";
    setTimeout(connectWS, 2000);
  };
  ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
}

function handleMessage(msg) {
  if (msg.type === "connected") {
    addLog("✅ Connected to backend — ready to simulate.", "system");
  }
  if (msg.type === "log") {
    addLog(msg.message, msg.agent === "system" ? "system" : "thinking");
  }
  if (msg.type === "agent_result") {
    addLog(`${msg.agent_name}:\n${msg.content}`, "result");
  }
  if (msg.type === "consensus") {
    addLog(msg.message, "consensus");
  }
  if (msg.type === "graph") {
    updateGraph(msg.data);
  }
  if (msg.type === "final_report") {
    showFinalReport(msg);
  }
  if (msg.type === "error") {
    addLog("❌ " + msg.message, "consensus");
    document.getElementById("status").className = "status error";
    document.getElementById("status").textContent = "❌ " + msg.message;
    document.getElementById("startBtn").disabled = false;
  }
}

function startSimulation() {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    alert("Not connected to backend.");
    return;
  }
  const topic = document.getElementById("topic").value.trim();
  const maxRounds = parseInt(document.getElementById("rounds").value);
  const agents = getAgents();

  if (!topic) {
    alert("Please enter a topic.");
    return;
  }
  if (agents.length < 2) {
    alert("Please add at least 2 agents.");
    return;
  }

  document.getElementById("logs").innerHTML = "";
  document.getElementById("final-report").style.display = "none";
  document.getElementById("final-badge").innerHTML = "";
  document.getElementById("startBtn").disabled = true;
  document.getElementById("status").className = "status running";
  document.getElementById("status").textContent = "⚡ Simulation running...";

  ws.send(JSON.stringify({
    action: "start",
    topic,
    max_rounds: maxRounds,
    agents
  }));
}

function showFinalReport(msg) {
  document.getElementById("startBtn").disabled = false;
  document.getElementById("status").className = "status done";
  document.getElementById("status").textContent =
    `✅ Done in ${msg.total_rounds} rounds`;
  document.getElementById("final-badge").innerHTML =
    `<span class="badge">Consensus: ${(msg.consensus_score * 100).toFixed(0)}%</span>`;
  const report = document.getElementById("final-report");
  report.style.display = "block";
  report.textContent = msg.content;
  document.getElementById("graph-wrap").style.display = "none";
  updateGraph(msg.graph);
}

// ── D3 Graph ─────────────────────────────────────────────
function updateGraph(data) {
  const svg = d3.select("#graph-svg");
  svg.selectAll("*").remove();
  if (!data || !data.nodes.length) return;

  const el = document.getElementById("graph-svg");
  const W = el.clientWidth || 600;
  const H = el.clientHeight || 280;
  const g = svg.append("g");

  svg.call(d3.zoom().scaleExtent([0.3, 3])
    .on("zoom", (e) => g.attr("transform", e.transform)));

  const sim = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.edges).id(d => d.id).distance(80))
    .force("charge", d3.forceManyBody().strength(-180))
    .force("center", d3.forceCenter(W / 2, H / 2));

  const link = g.append("g").selectAll("line")
    .data(data.edges).join("line")
    .attr("class", "link")
    .attr("stroke-width", d => Math.sqrt(d.weight || 1));

  const node = g.append("g").selectAll("g")
    .data(data.nodes).join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  node.append("circle")
    .attr("r", d => d.type === "agent" ? 14 : 7)
    .attr("fill", d => {
      if (d.type === "agent") {
        const idx = data.nodes.filter(n => n.type === "agent").indexOf(d);
        return palette[idx % palette.length];
      }
      return "#334155";
    })
    .attr("stroke", "#0f1117");

  node.append("text")
    .attr("dy", d => d.type === "agent" ? -18 : -11)
    .attr("text-anchor", "middle")
    .text(d => d.id.length > 20 ? d.id.substring(0, 18) + "…" : d.id);

  sim.on("tick", () => {
    link
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });
}

// ── Init ─────────────────────────────────────────────────
defaultAgents.forEach(a => addAgent(a));
connectWS();
</script>
</body>
</html>
